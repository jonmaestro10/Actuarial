[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actuarial-engine"
version = "0.0.1"
description = "Open actuarial projection engine: declarative model DSL with a vectorizing executor"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# pyyaml is here for scripts/local_matrix.py, which reads .github/workflows/ci.yml
# rather than restating what it contains. It is in `test` because the test that
# guards the reader needs it, and §1.4's rule for anything outside engine/core,
# data, library and report is exactly this: an optional extra, imported behind a
# guard, with tests that skipif it is absent.
test = ["pytest>=8", "python-dateutil>=2.8", "pyyaml>=6"]
api = ["fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.27"]
data = ["pyarrow>=15"]
excel = ["openpyxl>=3.1", "xlwings>=0.31"]
# The compiler B1 proposes to build on. Present so the bitwise boundary in
# engine/core/bitwise.py can be *measured* against it rather than asserted;
# nothing in engine/ imports it, and engine/core stays NumPy-only (§1.4).
compile = ["numba>=0.61"]
# The device backend B3 is written against. CuPy mirrors NumPy's op set,
# which is why the executor is written once and the backend is a namespace.
# Nothing in engine/ imports it unconditionally: engine/core/gpu.py falls
# back to NumPy and says so at DEVICE_STATUS.
gpu = ["cupy-cuda12x>=13"]

[tool.setuptools.packages.find]
include = ["engine*"]

# RFC-032's page. Three text files that are part of the API surface, so
# they ship with it — a wheel without them serves a 500 at /ui.
[tool.setuptools.package-data]
"engine.api.ui" = ["*.html", "*.js", "*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Registered rather than left implicit: an unknown mark is a warning today
# and the pre-push sequence runs `-W error::SyntaxWarning`, so the next
# person to widen that to `-W error` would find the suite failing on a typo
# in a decorator.
markers = [
    "slow: needs a container runtime or otherwise takes minutes; skipped where the dependency is absent, never simulated",
]

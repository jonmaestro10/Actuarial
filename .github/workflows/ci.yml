name: CI

# **One trigger: a pull request into main.** No push, no other base branch.
#
# The history is worth keeping, because each step removed real waste. The pair
# `push: ["**"]` + `pull_request` fired *both* events for every push to a
# branch with an open PR, running every job twice for one commit's worth of
# signal — fourteen of thirty consecutive runs, 47% of all billing. Restricting
# `push` to main removed that half. Dropping `push` entirely removes the
# duplicate a merge would otherwise add on top of the PR that already ran.
#
# So checks land **before** the merge, which is where they are worth most: main
# does not go red from a merge that was never verified. The cost is that
# billing scales with how often a branch is pushed rather than how often it is
# merged — which is what the `concurrency` block below is for.
#
# There is no `paths-ignore` here and there must not be one. A docs-only change
# is not a no-op in this repo: tests/test_working_agreement.py,
# test_documentation.py and test_architecture.py assert against CLAUDE.md and
# docs/, and the evidence pack embeds documented figures. Skipping CI on a
# docs-only diff would skip exactly the tests that diff can break.
on:
  pull_request:
    branches: ["main"]

# A superseded run costs the same minutes as a live one, and with `push` gone
# every run belongs to a pull request — so there is no longer any ref that must
# be exempt. Force-push a branch three times and only the third run survives;
# the first two were answering questions about commits nobody will merge.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.13 measured green on the full suite against numpy 2.5.1 before
        # being added here.
        #
        # 3.14 is *not* known to be blocked — an earlier note here said it was
        # and that note was wrong. It came from testing 3.14.0**rc2**, where
        # pydantic's `typing._eval_type(..., prefer_fwd_module=True)` raises
        # TypeError. The parameter was added to CPython between rc2 and
        # release: it is absent at tag v3.14.0rc2 and present at v3.14.0. So
        # the failure is an artefact of the pre-release, not a defect, and
        # 3.14 is untested here rather than excluded. Add it once a runner
        # with 3.14 *final* has actually run the suite.
        #
        # **The matrix is already heterogeneous in NumPy, and permanently.**
        # numpy 2.5 requires Python >= 3.12, so the 3.11 job resolves 2.4.x
        # and every other job resolves 2.5.x. That is fine and was checked
        # rather than assumed: the bit patterns of exp, log, log1p, expm1,
        # power, sqrt and sin over 200,000 values are byte-identical between
        # 2.4.6 and 2.5.1, so no golden value and no pack digest moves across
        # the matrix. It is worth re-checking on the next NumPy minor.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test,data,api,excel]"
      - run: pytest -q
      # RFC-049's acceptance: the evidence pack builds, and a rebuild from
      # the same source is byte-identical — the directory is named by the
      # pack digest, so `diff -r` fails if either the digest or any section
      # moved.
      - name: Build the validation evidence pack, twice
        run: |
          python scripts/evidence_pack.py --out evidence
          python scripts/evidence_pack.py --out evidence-rebuild
          diff -r evidence evidence-rebuild

  # **A second architecture, for the class of bug the first CI run found.**
  #
  # RFC-072 asserted that the operations §9.2 declines to require correct
  # rounding for really do differ under a compiler. That was true on the
  # machine it was written on and false on this runner — NumPy dispatches
  # AVX-512 kernels for the transcendentals while the compiler calls libm, so
  # the answer is a property of the silicon. It survived the whole life of the
  # item because it had only ever been measured in one place.
  #
  # arm64 is the sharpest available probe for whatever else is like that:
  # different SIMD (NEON/SVE) and a different libm, where Intel-versus-AMD
  # would barely differ. It is also nearly free — arm64 standard runners
  # reached private repositories in January 2026, count against the plan's
  # included minutes, and bill *below* the x64 rate.
  #
  # One version, not the matrix. The question is what changes with the
  # architecture, and asking it three times over three interpreters would pay
  # three times for one answer.
  #
  # What this does **not** do is widen any reproducibility claim. §1.2's
  # executor equivalence is a within-machine invariant and stays one; a pack
  # digest is an identity on a machine (REPRODUCIBILITY_SCOPE) and the two
  # pack builds below are compared against each other on this runner, never
  # against x64. If this job goes red, read it as a finding about a test that
  # asserted something architectural, not as a portability defect to paper
  # over.
  test-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test,data,api,excel]"
      - run: pytest -q
      - name: Build the validation evidence pack, twice
        run: |
          python scripts/evidence_pack.py --out evidence
          python scripts/evidence_pack.py --out evidence-rebuild
          diff -r evidence evidence-rebuild

  # RFC-080's expected-change note, enforced. §3.5 asks that a change moving a
  # numeric result says what it does to the numbers, because a code diff cannot
  # show that and a reviewer cannot derive it. The gate asks one question: did
  # a golden expected value move without CHANGELOG.md moving too?
  #
  # `fetch-depth: 0` is not optional. The default shallow clone has no base ref
  # to diff against, and the gate exits 2 rather than reporting "no golden
  # value changed" about a comparison it never made — a pass and a
  # could-not-run must not look alike.
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: A moved number carries an expected-change note
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python scripts/changelog_gate.py --base "origin/${{ github.base_ref }}"

  # RFC-079's dependency check. Advisory rather than blocking, and the reason
  # is stated rather than assumed: engine/core, data, library and report have
  # NumPy as their only runtime dependency (§1.4), so an advisory here almost
  # always lands in an optional extra or a test tool. A blocking gate on a feed
  # that changes daily becomes a gate people disable, and a disabled gate
  # reports nothing at all — whereas this leaves the finding in the build
  # record either way, which is what an auditor asks for.
  #
  # `continue-on-error` and not `|| true`: the step's own conclusion stays
  # visible in the run summary, where `|| true` would render it green.
  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test,data,api,excel]" pip-audit
      - name: Audit the installed dependency set
        run: pip-audit --strict --progress-spinner off

  # RFC-072's boundary, measured rather than quoted. A separate job because
  # it is the only thing in the repo that needs a compiler: installing it
  # into the matrix above would put a 60 MB llvmlite download in front of
  # every test run, and a failure to build it would block a suite that does
  # not depend on it. Here it fails on its own.
  #
  # It is not optional. Without this job the 39 measurement cases in
  # tests/test_bitwise_boundary.py skip, and a skipped measurement reads
  # exactly like a passing one in the summary line.
  bitwise-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[test,compile]"
      # REQUIRE_COMPILE_EXTRA turns "the compiler is missing, so skip" into
      # "the compiler is missing, so fail". Without it a job whose install
      # step half-succeeded would skip all 39 measurement cases and report
      # green, which is the failure mode this job exists to prevent.
      - name: Measure what a compiled kernel reproduces bit for bit
        env:
          REQUIRE_COMPILE_EXTRA: "1"
        run: pytest -q tests/test_bitwise_boundary.py
